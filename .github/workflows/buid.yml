name: Build Arc-9 Kinetix VST3 (Windows 64-bit)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC & CMake
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Package VST3
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release_pkg
        $vst3 = Get-ChildItem -Path build -Filter "*.vst3" -Recurse | Select-Object -First 1
        if ($vst3) {
            Copy-Item -Path $vst3.FullName -Destination release_pkg/ -Recurse
            Compress-Archive -Path release_pkg/* -DestinationPath Arc-9_Kinetix_Win64.zip
        } else {
            Write-Error "VST3 file not found in build directory!"
            exit 1
        }

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arc-9_Kinetix_Windows_x64
        path: Arc-9_Kinetix_Win64.zip
